[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "timesfm3-probing"
version = "0.1.0"
description = "Diagnostic probing of cross-channel information use in multivariate time-series foundation models"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Anonymous Author(s)"}
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "timesfm>=1.3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]
